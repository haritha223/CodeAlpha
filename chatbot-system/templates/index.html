<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloud FAQ Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="chat-container">
    <header class="chat-header">
      <h1>Cloud FAQ Chatbot</h1>
      <p class="subtitle">Ask quick questions — try: <strong>hello</strong>, <strong>fees</strong>, <strong>timing</strong>, <strong>contact</strong></p>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="message-input" name="message" placeholder="Type a question (e.g. "hello")" autocomplete="off" />
      <button id="send-btn" type="submit">Send</button>
    </form>

    <footer class="chat-footer">This is a rule-based FAQ bot — suitable for beginner projects and cloud deployment.</footer>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
